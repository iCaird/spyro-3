name: Build and verify checksums

on:
  pull_request:

jobs:
  build:
    name: "Build and verify checksums (antipiracy = ${{ matrix.antipiracy }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        antipiracy: [true, false]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y binutils-mips-linux-gnu cpp-mips-linux-gnu python3
          python3 -m pip install colorama

      - name: Run build
        run: |
          python3 build_multiproc.py ${{ matrix.antipiracy && '--antipiracy --compile-dragonbreath' || '' }}

      # - name: Build Docker image
